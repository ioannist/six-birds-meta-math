[[claim]]
paper_label = "thm:main:probe-family-currency"
paper_section = "Legal quotient and native currency"
description = "Narrowed surrogate of the paper's Cap_C(y^*L; Ran Γ) = y^T K_{C,Γ}(L) y. Lean's `capacity` is `quad C_Γ` at the MP-optimal direction u* = C_Γ^† L_Γ^T y (a point evaluation, NOT a variational supremum); under StrictPositiveDiagonal C_Γ this equals y^T K y by a 13-step matrix-algebra calc chain."
status = "partial"
lean_subproject = "."
lean_module = "SixBirdsMetaMath.Main.LegalQuotient"
lean_decl = "SixBirdsMetaMath.Main.LegalQuotient.probeFamilyCurrency"
notes = "Two narrowings vs the paper. (1) HYPOTHESIS: paper assumes `L(Ker C) = 0` (null-mode legality, allowing kernel directions); Lean assumes the strictly stronger `StrictPositiveDiagonal (packagedAudit C Gamma)` (no kernel on Ran Γ). The `NullLegal` predicate is defined in the module but unused; wiring it in is part of closing the gap. (2) STATEMENT: paper's Cap_C is a variational supremum `sup_u (y^T L u)^2 / quad C_Γ u`; Lean's `capacity` is a point evaluation `quad C_Γ (D† L_Γ^T y)`. The Lean theorem establishes a matrix-algebra identity (point eval = y^T K y) but does NOT prove the variational characterization (Cauchy–Schwarz upper bound + attainment) that the paper's claim requires. The 2nd and 3rd conjuncts (membrane budget ↔ Loewner; ¬ budget ↔ ∃ critical-pair witness) are propositional unfoldings, not substantive math content. Promoting to `status = theorem` requires (a) wiring NullLegal into the proof, (b) redefining `capacity` variationally with a Cauchy–Schwarz upper bound and attainment proof. Proof uses matVec_matMul, dot_matVec_transpose, transpose_diagonalPseudoInverse, diagonalPseudoInverse_strictPositiveDiagonal_inverse."

