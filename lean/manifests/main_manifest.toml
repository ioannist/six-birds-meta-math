[[claim]]
paper_label = "thm:main:adequacy-aware-transfer"
paper_section = "All-six records, transfer, and taxonomy"
description = "Data-shape placeholder: LawfulMembraneTransfer bundles source/target operators and four transport maps; the theorem only witnesses field existence plus definitional unfoldings of IsExactBridge and IsDefectiveBridge. No laws tie the transport maps to the source/target operators, and no quantitative paper claim is mechanized."
status = "partial"
lean_subproject = "."
lean_module = "SixBirdsMetaMath.Main.AllSix"
lean_decl = "SixBirdsMetaMath.Main.AllSix.adequacyAwareTransfer"
notes = "The paper theorem is qualitative: it asserts that a lawful membrane transfer must transport four components (energy, native, dissolving, residual), that exact bridges transport budgets by congruence, and that defective bridges produce explicit PSD residual currencies absorbed in the target budget. This Lean entry is a data-shape placeholder: LawfulMembraneTransfer is a record with source/target operators and four transport maps, but it imposes no laws tying those maps to the source or target operators. There are no isometry constraints on S_*, no commutation laws, no operator-equation laws, and no proof that transported source data equals target data. IsExactBridge and IsDefectiveBridge encode congruence and paid-defect cases as optional certificates; the theorem only witnesses field existence and unfolds those predicates when a certificate is supplied. No congruence-vs-PSD-defect quantitative deduction is made, and no new operator inequality is derived. The paper's all-six-records taxonomy (P_1 rewrite/gauge through P_6 audit/currency) and membrane-type taxonomy (intrinsic / sectioned / bundle / protocol) are not encoded; they would require typeclass-style hierarchies or finite enumeration types beyond Package 4's scope."
