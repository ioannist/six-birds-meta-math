lean_subproject = "."
lean_module = "SixBirdsMetaMath.Main.XiInterface"
lean_decl = "SixBirdsMetaMath.Main.XiInterface.adequacyInterface"
notes = "Three branches of the paper theorem. Branch 1 (Schur identity): proved algebraically here, parameterized by hKLDsym, hKLLdaggerSym, hMPLLD. Branch 2 (Loewner monotonicity under K_LL ⪯ Θ_Y and Ξ ⪯ Ω_Z): deferred until PSD/Loewner closure machinery is built (sum of PSDs, conjugation A·X·A^T of PSDs). Branch 3 (Ξ = 0 ↔ ∃ A: D_0 = A L_0 ↔ Ker L_0 ⊆ Ker D_0): deferred until kernel/range duality machinery is built. Additional narrowing: this module models C^dagger as `diagonalPseudoInverse C`; the paper's C_0^{-1} is the genuine Moore-Penrose inverse on the legal quotient. The Lean theorem is paper-faithful only under an implicit `StrictPositiveDiagonal C` assumption, the same narrowing carried in Phase E §1."

