# Lean validation manifest for the NS paper axis.
#
# Each entry corresponds to a paper_label from
# formalization/inventory/ns_paper_inventory.toml whose
# intended_status is "mechanize_now". The manifest records the accepted
# Lean realization status for each inventoried paper item.
#
# Status meanings (verbatim from F2/F3):
# - definition:   paper definition has a Lean definition-like declaration
# - theorem:      paper claim has a Lean theorem/lemma whose dependency audit passes
# - axiomatic:    declaration is or depends on project-local axioms (not allowed here)
# - partial:      declaration mechanizes only a supporting fragment
# - unformalized: no Lean correspondent is present yet
#
# Schema (per entry):
#   paper_label    = "<kind>:<axis>:<short-name>"  # from per-axis paper_inventory
#   paper_section  = "<section title>"
#   description    = "<one-line summary>"
#   status         = "<one of the values above>"
#   lean_subproject = "."                          # single lakefile project
#   lean_module    = "SixBirdsMetaMath.NS.<Section>"
#   lean_decl      = "SixBirdsMetaMath.NS.<Section>.<name>"
#   notes          = ""
#
# Use `[[definition]]` for definition_kind entries, `[[claim]]` for
# theorem/lemma/proposition/corollary entries. This mirrors F2/F3's
# manifest TOML idiom.
#
# Entries may start as `status = "unformalized"` and `lean_decl = ""`;
# accepted Lean correspondents update status to `definition`, `theorem`,
# or `partial` as appropriate.

