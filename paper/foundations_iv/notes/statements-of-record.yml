# Statements of Record — Foundations IV
# Canonical registry for manuscript claims and formalization-support wording.
# Current direct theorem alignment: 48 faithful paper-formula rows
# and 1 row needing strengthening (F14).
#
# One row per main paper claim (52 F-IV inventory rows). Helper
# definitions surfaced as paper-prose vocabulary appear in
# `prose-names.md` (Helper section) and `app:formalization` mapping
# tables; they are not duplicated here.
#
# Field discipline:
#   paper_label         e.g. F2, F13a, F13b
#   env_kind            definition / theorem / lemma / proposition /
#                       corollary / remark / warning / nonclaim /
#                       obligation / substrate_pending / anchor_substrate
#   source_file         canonical paper source path
#   source_section      the named claim within the thread file
#   theorem_title       paper-prose name from prose-names.md
#   target_destination  body / appendix / source_only
#   target_axis         Transport / Stability / Access / Symmetry /
#                       StatusRecordsCoherence / SelfReferenceLimits /
#                       ClosureRealityBoundary
#   target_chapter      one of 6 drafting chapters
#   target_section_hint e.g. sec:transport:descent-repair
#   proof_presentation  body_full / body_sketch / appendix_only /
#                       lean_substantive / lean_traceability_only /
#                       standard_reference / definition_entry /
#                       anchor_citation
#   lean_coverage       theorem / partial / obligation /
#                       substrate_pending / anchor_substrate /
#                       definition / not_mechanized
#   lean_decl           full Lean path (mirror of manifest)
#   semantic_alignment  faithful / narrowed_surrogate /
#                       weakened_genericized / needs_strengthening /
#                       projection_packaged / anchored_to_substrate /
#                       not_applicable
#   substrate_cite      bibtex key(s); blank if not an anchor
#   trust_base_tag      obligation / substrate_pending / none
#   axiom_shape         Lean axiom signature (blank if not tagged)
#   obligation_guard    opaque source-predicate name (blank if not tagged)
#   guard_decl          full Lean path to guard (blank if not tagged)
#   notes               paper-side wording / disclosure hints
#
# Bibtex keys are the locked references.bib entries
# (`Tsiokos2026<ShortName>` convention; see
# paper/foundations_iv/notes/references-selection.md).

