# paper_inventory.toml — Foundations IV paper
#
# Canonical source bundle:
# - paper/foundations_iv/notes/source_fidelity_split.md (source bucket assignment)
# - Foundations IV statement source bundle (50 laws + 3 atlas records)
# - paper/foundations_iv/proposal.md (axis grouping, anchor table)
#
# Status vocabulary:
#   mechanize_now      — full Lean realization required
#   theorem            — full Lean realization proved directly
#   partial            — theorem applying a # substrate_pending axiom
#   obligation         — Lean `axiom`, tagged # obligation in trust_base.txt
#   substrate_pending  — Lean `axiom`, tagged # substrate_pending in trust_base.txt
#   anchor_substrate   — theorem applying an adapter to existing substrate Lean decl
#   support_only       — typed `def` recording cascade evidence; not a proof gate
#   nonclaim           — explicitly negated; documented only
#
# Atlas records are NOT inventoried: they are planning artifacts
# referenced by proposal.md, not mechanizable laws.
#
# Label scheme: F<file-number>[a|b for split files]. 52 mechanizable rows:
#   49 mechanize_now/theorem + 2 anchor_substrate (F6, F53) +
#    1 partial (F13a — applies a same-module # substrate_pending axiom).

