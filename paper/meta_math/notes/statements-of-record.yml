# Meta-Math statements of record
# Locked 2026-05-27. Canonical registry for manuscript claims and
# formalization-support wording.
#
# One row per labeled paper-side claim. Fields:
#
#   paper_label          — primary label (e.g. T1, T1-obligation, T5,
#                          T16-pending, T15-overlap-lemma, val:ns,
#                          nonclaim:bsd, etc.).
#   env_kind             — definition / theorem / lemma / corollary /
#                          remark / warning / nonclaim / obligation /
#                          support_only / validation.
#   source_file          — proposal / M5 / M6 / canonical paper source
#                          path / substrate paper bibkey.
#   source_section       — named claim within the source.
#   source_lines         — line range or section anchor in source.
#   theorem_title        — paper-prose name from prose-names.md.
#   target_destination   — body / appendix / source_only /
#                          evidence_pack_only / nonclaim.
#   target_part          — I / II / III / Apparatus / Validation /
#                          Audit / Predictions / Scope / Conclusion.
#   target_section_hint  — \label{sec:...} hint.
#   proof_presentation   — body_full / body_sketch / appendix_only /
#                          lean_substantive / lean_traceability_only /
#                          standard_reference / definition_entry /
#                          obligation_disclosure / validation_citation
#                          / nonclaim_statement.
#   lean_coverage        — theorem / partial / obligation /
#                          substrate_pending / definition /
#                          not_mechanized / not_applicable.
#   lean_decl            — full Lean path (from manifest) or
#                          "not_applicable".
#   semantic_alignment   — faithful / narrowed_surrogate /
#                          weakened_genericized / needs_strengthening /
#                          projection_packaged / opacity_guarded /
#                          not_applicable.
#   obligation_guard     — opacity-guard predicate name (only for
#                          obligation rows; empty otherwise).
#   substrate_cite       — bibkey for §5 validation rows; empty otherwise.
#   notes                — paper-side wording / disclosure hints.

