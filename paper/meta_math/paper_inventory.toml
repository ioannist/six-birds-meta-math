# paper_inventory.toml — meta-math paper (M5+M6 merged)
#
# Canonical source bundle:
# - paper/meta_math/proposal.md  (identity + status for T1-T17)
# - M6 source bundle  (statements + proof spines for T1-T6, T11-T17)
# - M5 source bundle  (statements for T7-T10)
#
# Status vocabulary:
#   mechanize_now      — full Lean realization required
#   partial            — theorem applying either a `# substrate_pending` axiom
#                        (cross-paper dependency) or a same-paper `# obligation`
#                        axiom (intra-paper dependency, e.g. T1 depends on T3).
#                        The partial declaration is itself a theorem, not an
#                        axiom; its axiom-audit footprint is whichever tagged
#                        axiom it applies.
#   obligation         — Lean `axiom`, tagged `# obligation` in trust_base.txt
#   substrate_pending  — Lean `axiom`, tagged `# substrate_pending` in trust_base.txt
#   support_only       — typed `def` recording cascade evidence; not a proof gate
#   nonclaim           — explicitly negated; documented only
#
# Mechanization sources:
#   M6 = carrier-dichotomy / foreclosure source bundle
#   M5 = recognition-mode landing source bundle

